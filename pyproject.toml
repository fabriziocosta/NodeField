[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nodefield"
version = "0.0.1"
description = "Conditional node field graph generation framework"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Fabrizio", email = "fabrizio@example.com" }]
keywords = ["graph", "generation", "pytorch", "node-field", "conditional"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Operating System :: OS Independent"
]

dependencies = [
  "numpy<3",
  "torch",
  "scipy",
  "pandas",
  "scikit-learn",
  "networkx",
  "pulp",
  "dill"
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "jupyterlab", "notebook"]
training = [
  "pytorch-lightning",
  "matplotlib"
]
notebooks = [
  "requests"
]
synthetic = [
  "toolz"
]
ecosystem = [
  "abstractgraph>=0.1.0",
  "abstractgraph-ml>=0.1.0",
  "abstractgraph-graphicalizer>=0.1.0"
]
chem = [
  "abstractgraph-graphicalizer[chem]>=0.1.0; python_version < '3.13'",
  "abstractgraph-graphicalizer>=0.1.0; python_version >= '3.13'"
]
full = [
  "pytorch-lightning",
  "matplotlib",
  "requests",
  "toolz",
  "abstractgraph>=0.1.0",
  "abstractgraph-ml>=0.1.0",
  "abstractgraph-graphicalizer[chem]>=0.1.0; python_version < '3.13'",
  "abstractgraph-graphicalizer>=0.1.0; python_version >= '3.13'"
]

[tool.setuptools.packages.find]
where = ["."]
include = [
  "conditional_node_field_graph_generator*"
]
exclude = ["tests*", "docs*", "notebooks*", "*.egg-info"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]

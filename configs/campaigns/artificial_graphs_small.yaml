campaign:
  id: artificial_graphs_small
  domain: artificial_graphs
  prefix: artificial_graphs_small
artifacts:
  root: artifact
logbook:
  path: LOGBOOK_artificial_graphs.md
runner:
  config_path: notebooks/configs/artificial_graph_hyperparameter_optimization.yaml
  poll_seconds: 1800
dataset:
  num_graphs: 300
  cycle_length: 6
  path_length: 4
  num_rays: 3
  ray_length: 2
  node_alphabet_size: 3
  edge_alphabet_size: 1
  node_alphabet_kind: int
  edge_alphabet_kind: int
  component_specific_alphabets: true
  seed: 42
generation:
  n_samples: 32
  feasibility_effort: 1
  feasibility_filter: none
random_search:
  batch_size: 1
  random_state: 202

scientific_loop:
  primary_metric: average_num_violations
  budgets:
    maximum_single_experiment_gpu_hours: 20
    maximum_parallel_runs: 1

agent:
  stateful_loop: true
  model: gpt-5.3-codex
  reasoning_effort: medium
  max_output_tokens: 2000
  api_key_env: OPENAI_API_KEY
  prompts:
    proposal: configs/campaigns/prompts/nodefield_campaign_proposal.md
    logbook: configs/campaigns/prompts/nodefield_campaign_logbook.md
  proposal_mode: exact_configs
  mutable_groups:
  - architecture
  - training
  - loss_weights
  - sampling
  allowed_paths:
  - model.fixed
  - model.search_space
  max_search_leaf_count: 23
  reason: Restart the small artificial campaign from the original low-product-score
    basin using 300 training graphs, 32 generated scoring samples, and feasibility
    effort 1 to avoid slow/high-variance oracle refinement.
  next_attempt: Run one exact trial at the midpoint of the original tight range around
    the product-score 1.53 attempt.
  default_trial_configs:
  - model:
      fixed:
        latent_embedding_dimension: 64
        node_embedding_svd_dimension: 32
        graph_embedding_svd_dimension: 32
        number_of_transformer_layers: 1
        transformer_attention_head_count: 4
        transformer_dropout: 0.07231
        learning_rate: 0.000175
        batch_size: 16
        total_steps: 307
      search_space:
        lambda_degree_importance: 0.741675
        lambda_node_exist_importance: 2.643475
        lambda_node_count_importance: 0.913875
        lambda_node_label_importance: 2.918625
        lambda_edge_label_importance: 2.32885
        lambda_direct_edge_importance: 1.60815
        lambda_auxiliary_edge_importance: 1.84485
        sparse_supervision_mask_ratio: 0.181086
        sampling_step_size: 0.0192201

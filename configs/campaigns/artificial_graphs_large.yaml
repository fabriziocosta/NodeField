campaign:
  id: artificial_graphs_large
  domain: artificial_graphs
  prefix: artificial_graphs_large
artifacts:
  root: artifact
logbook:
  path: LOGBOOK_artificial_graphs.md
runner:
  config_path: notebooks/configs/artificial_graph_hyperparameter_optimization.yaml
  poll_seconds: 3600
dataset:
  num_graphs: 1000
  cycle_length: 10
  path_length: 8
  num_rays: 5
  ray_length: 4
  node_alphabet_size: 3
  edge_alphabet_size: 1
  node_alphabet_kind: int
  edge_alphabet_kind: int
  component_specific_alphabets: true
  seed: 1042
generation:
  n_samples: 16
  feasibility_effort: 2
  feasibility_filter: none
random_search:
  batch_size: 1
  random_state: 1202

scientific_loop:
  primary_metric: average_num_violations
  budgets:
    maximum_single_experiment_gpu_hours: 20
    maximum_parallel_runs: 1

agent:
  stateful_loop: true
  model: gpt-5.3-codex
  reasoning_effort: medium
  max_output_tokens: 2000
  api_key_env: OPENAI_API_KEY
  prompts:
    proposal: configs/campaigns/prompts/nodefield_campaign_proposal.md
    logbook: configs/campaigns/prompts/nodefield_campaign_logbook.md
  proposal_mode: range_search
  mutable_groups:
  - architecture
  - training
  - loss_weights
  - sampling
  allowed_paths:
  - model.fixed
  - model.search_space
  max_search_leaf_count: 23
  reason: 'Latest completed trial remains infeasible (feasible_rate=0.0) with mixed
    quality: median violations improved (517) but average violations regressed (769.87),
    indicating unstable tails. A focused local exploit step should improve consistency.'
  next_attempt: Sample 1 local exploit candidate with longer training and smaller
    sampling step size while keeping architecture fixed and lambdas tightly near 5.0.
  default_trial_patch_space:
    model:
      fixed:
        latent_embedding_dimension:
          type: choice
          values:
          - 128
        node_embedding_svd_dimension:
          type: choice
          values:
          - 128
        graph_embedding_svd_dimension:
          type: choice
          values:
          - 128
        number_of_transformer_layers:
          type: choice
          low: 2
          high: 4
          values:
          - 4
        transformer_attention_head_count:
          type: choice
          values:
          - 4
        transformer_dropout:
          type: real
          low: 5.0e-05
          high: 0.00012
        learning_rate:
          type: real
          low: 3.4e-06
          high: 4.1e-06
          scale: log
        batch_size:
          type: choice
          values:
          - 8
        total_steps:
          type: int
          low: 8000
          high: 12000
      search_space:
        lambda_degree_importance:
          type: real
          low: 4.9998
          high: 5.0
        lambda_node_exist_importance:
          type: real
          low: 4.999
          high: 5.0
        lambda_node_count_importance:
          type: real
          low: 4.9996
          high: 5.0
        lambda_node_label_importance:
          type: real
          low: 4.999
          high: 5.0
        lambda_edge_label_importance:
          type: real
          low: 4.9998
          high: 5.0
        lambda_direct_edge_importance:
          type: real
          low: 4.9998
          high: 5.0
        lambda_auxiliary_edge_importance:
          type: real
          low: 4.9985
          high: 5.0
        sparse_supervision_mask_ratio:
          type: real
          low: 0.0
          high: 1.0e-08
        sampling_step_size:
          type: real
          low: 9.0e-05
          high: 0.00013
        lambda_edge_count_importance:
          type: real
          low: 4.9985
          high: 5.0
        lambda_degree_edge_consistency_importance:
          type: real
          low: 4.9985
          high: 5.0

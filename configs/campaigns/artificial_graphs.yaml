campaign:
  id: artificial_graphs
  domain: artificial_graphs
  prefix: artificial_graphs

artifacts:
  root: artifact

logbook:
  path: LOGBOOK_artificial_graphs.md

runner:
  config_path: notebooks/configs/artificial_graph_hyperparameter_optimization.yaml

dataset:
  num_graphs: 300
  cycle_length: 6
  path_length: 4
  num_rays: 3
  ray_length: 2
  node_alphabet_size: 3
  edge_alphabet_size: 1
  node_alphabet_kind: int
  edge_alphabet_kind: int
  component_specific_alphabets: true
  seed: 42

random_search:
  batch_size: 3
  random_state: 202

agent:
  proposal_mode: range_search
  mutable_groups:
    - dataset
    - architecture
    - training
    - loss_weights
    - sampling
    - generation
  allowed_paths:
    - dataset
    - generation
    - model.fixed
    - model.search_space
  max_search_leaf_count: 28
  reason: Explore artificial graph validity using graph complexity, architecture size, training budget, loss weights, and sampling controls.
  next_attempt: Compare feasibility violations, then tighten graph complexity and architecture ranges around the best candidates.
  default_trial_patch_space:
    dataset:
      num_graphs:
        type: int
        low: 150
        high: 600
      cycle_length:
        type: int
        low: 4
        high: 9
      path_length:
        type: int
        low: 2
        high: 7
      num_rays:
        type: int
        low: 2
        high: 5
      ray_length:
        type: int
        low: 1
        high: 4
    model:
      fixed:
        latent_embedding_dimension:
          type: choice
          values: [32, 64, 128]
        node_embedding_svd_dimension:
          type: choice
          values: [32, 64, 128]
        graph_embedding_svd_dimension:
          type: choice
          values: [32, 64, 128]
        number_of_transformer_layers:
          type: int
          low: 1
          high: 4
        transformer_attention_head_count:
          type: choice
          values: [2, 4, 8]
        transformer_dropout:
          type: real
          low: 0.05
          high: 0.25
        learning_rate:
          type: real
          low: 0.00005
          high: 0.0005
          scale: log
        batch_size:
          type: choice
          values: [8, 16, 24]
        total_steps:
          type: int
          low: 40
          high: 120
      search_space:
        lambda_degree_importance:
          type: real
          low: 0.5
          high: 3.0
        lambda_node_exist_importance:
          type: real
          low: 0.5
          high: 3.0
        lambda_node_count_importance:
          type: real
          low: 0.0
          high: 1.5
        lambda_node_label_importance:
          type: real
          low: 0.5
          high: 3.0
        lambda_edge_label_importance:
          type: real
          low: 0.5
          high: 3.0
        lambda_direct_edge_importance:
          type: real
          low: 0.5
          high: 3.0
        lambda_auxiliary_edge_importance:
          type: real
          low: 0.5
          high: 3.0
        sparse_supervision_mask_ratio:
          type: real
          low: 0.0
          high: 0.35
        sampling_step_size:
          type: real
          low: 0.025
          high: 0.075
    generation:
      feasibility_effort:
        type: int
        low: 1
        high: 4
      n_samples:
        type: choice
        values: [8, 16, 24]

campaign:
  id: molecules
  domain: molecules
  prefix: molecules

artifacts:
  root: artifact

logbook:
  path: LOGBOOK.md

runner:
  config_path: notebooks/configs/zinc_molecule_hyperparameter_optimization.yaml

random_search:
  batch_size: 3
  random_state: 101

agent:
  allowed_paths:
    - model.search_space.lambda_degree_importance
    - model.search_space.lambda_node_exist_importance
    - model.search_space.lambda_node_count_importance
    - model.search_space.lambda_node_label_importance
    - model.search_space.lambda_edge_label_importance
    - model.search_space.lambda_direct_edge_importance
    - model.search_space.lambda_auxiliary_edge_importance
    - model.search_space.sparse_supervision_mask_ratio
    - model.search_space.sampling_step_size
  max_search_leaf_count: 9
  reason: Keep the architecture fixed and sweep loss weights plus sampling step size for ZINC feasibility.
  next_attempt: Compare average violations, then narrow weights around the best one-point ranges.
  default_trial_patch_space:
    model:
      search_space:
        lambda_degree_importance:
          type: real
          low: 0.5
          high: 3.0
        lambda_node_exist_importance:
          type: real
          low: 0.5
          high: 3.0
        lambda_node_count_importance:
          type: real
          low: 0.0
          high: 1.5
        lambda_node_label_importance:
          type: real
          low: 0.5
          high: 3.0
        lambda_edge_label_importance:
          type: real
          low: 0.5
          high: 3.0
        lambda_direct_edge_importance:
          type: real
          low: 0.5
          high: 3.0
        lambda_auxiliary_edge_importance:
          type: real
          low: 0.5
          high: 3.0
        sparse_supervision_mask_ratio:
          type: real
          low: 0.0
          high: 0.35
        sampling_step_size:
          type: real
          low: 0.025
          high: 0.075
